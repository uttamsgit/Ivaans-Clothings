# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Ivaans Clothing CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Stage 1: Code Quality and Application Build
  code_quality:
    name: "stage 1 - code Quality"
    runs-on: self-hosted

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: INstall Dependencies  
      run: npm ci
    - name: Build React app
      run: npm run build

  # Stage 2: Secret Detection
  secret_scan:
    name: "Stage 2 - Secret Detection"
    runs-on: self-hosted

    steps:

    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Scan Repository for Secrets
      env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e

        if command -v gitleaks >/dev/null 2>&1; then
          echo "Gitleaks is already installed: $(gitleaks version)"
        else
          echo "Gitleaks not found. Installing..."

          GITLEAKS_VERSION="8.24.3"

          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          chmod +x /usr/local/bin/gitleaks

          echo "Gitleaks installed successfully."
        fi

        echo "Running Gitleaks scan..."
        gitleaks detect --source . --verbose




  # Stage 3 - Docker build and Security scan
  container_build_scan:
    name: "stage 3 - Conntainer build and Scan"
    runs-on: self-hosted
    needs:
      - code_quality
      - secret_scan

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t ivaans-clothings:latest .
          
    - name: Scan Docker images with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ivaans-clothings:latest
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH
        ignore-unfixed: true

  # Stage 4 - Publish Image to Aws ECR
  push_to_ecr:
    name: "Stage 4 - Push to Amozon ECR"
    runs-on: self-hosted
    needs:
      - container_build_scan

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build Docker Image for publishing
      run: docker build -t ivaans-clothings:latest .

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ap-southeast-2 | \
        docker login --username AWS --password-stdin 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com

    - name: Tag Docker Image
      run: |
        docker tag ivaans-clothings:latest 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:latest
        docker tag ivaans-clothings:latest 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:${{ github.sha }}

    - name: Push Docker Image to ECR
      run: |
        docker push 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:latest
        docker push 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:${{ github.sha }}
           


  # Stage 5: Deploy application to EC2
  deploy:
    name: "Stage 5 - Deploy to Application EC2"
    runs-on: self-hosted
    needs:
      - push_to_ecr


    steps:
    - name: Deploy application
      env:
        APP_HOST: ${{ secrets.APP_EC2_HOST }}
        SSH_PRIVATE_KEY: ${{ secrets.APP_EC2_SSH_KEY }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        set -e

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        KEY_FILE=$(mktemp)
        trap 'rm -f "$KEY_FILE"' EXIT

        printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
        chmod 600 "$KEY_FILE"

        ssh-keyscan -H "$APP_HOST" >> ~/.ssh/known_hosts

        ssh -i "$KEY_FILE" \
          -o StrictHostKeyChecking=yes \
          ubuntu@"$APP_HOST" \
          "IMAGE_TAG='$IMAGE_TAG' bash -s" <<'REMOTE'
            set -e

            ECR="534283254764.dkr.ecr.ap-southeast-2.amazonaws.com"
            IMAGE="$ECR/ivaans-clothings:$IMAGE_TAG"

            echo "Logging in to Amazon ECR..."
            aws ecr get-login-password --region ap-southeast-2 \
              | docker login --username AWS --password-stdin "$ECR"

            echo "Pulling image: $IMAGE"
            docker pull "$IMAGE"

            echo "Replacing application container..."
            docker rm -f ivaans-clothings 2>/dev/null || true

            docker run -d \
              --name ivaans-clothings \
              --restart unless-stopped \
              -p 80:5173 \
              "$IMAGE"

            echo "Checking application..."
            sleep 10
            curl --fail --retry 5 --retry-delay 3 \
            http://localhost/ >/dev/null

            echo "Deployment successful!"
            docker ps --filter name=ivaans-clothings
        REMOTE



  # Stage 6: Application Smoke Test
  smoke_test:
    name: "Stage 6 - Smoke Test"
    runs-on: self-hosted
    needs:
      - deploy
    steps:
    - name: Check application HTTP response
      run: |
        echo "Checking Ivaans Clothings application..."
        curl -f -s -S http://15.134.116.41/ -o /dev/null 

        echo "Application is responding successfully!"

