# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: INstall Dependencies  
      run: npm ci
    - name: Build React app
      run: npm run build
      
    - name: Checkout Source Code
      uses: action/checkout@v4
      
    - name: Scan Repository for secrets
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Checkout Source Code
      uses: actions/checkout@v4
          
    - name: Build Docker Image
      run: docker build -t ivaans-clothings:latest .
          
    - name: Scan Docker images with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ivaans-clothings:latest
        format: table
        exit-code: '0'
        severity: CRITICAL,HIGH

    - name: Login to Amazon ECR
      run: |
        aws ecr get-login-password --region ap-southeast-2 | \
        docker login --username AWS --password-stdin 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com

    - name: Tag Docker Image
      run: |
        docker tag ivaans-clothings:latest 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:latest
        docker tag ivaans-clothings:latest 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:${{ github.sha }}

    - name: Push Docker Image to ECR
      run: |
        docker push 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:latest
        docker push 534283254764.dkr.ecr.ap-southeast-2.amazonaws.com/ivaans-clothings:${{ github.sha }}
            
